services:
  nova:
    build:
      context: .
      extra_hosts:
        - "deb.debian.org:151.101.130.132"
        - "deb.debian.org:151.101.66.132"
        - "registry.npmjs.org:104.16.0.34"
        - "registry.npmjs.org:104.16.1.34"
    container_name: nova-bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
