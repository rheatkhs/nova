services:
  nova:
    build: .
    container_name: nova-bot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
